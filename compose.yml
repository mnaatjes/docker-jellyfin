---
# ==============================================================================
# Jellyfin Media Server - Docker Compose Specification
# Conforms to Homelab Systems Lifecycle (HSL) and ADR 0025 Deployment Standards
# ==============================================================================

services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    container_name: jellyfin
    restart: unless-stopped
    user: "${JELLYFIN_UID:-1000}:${JELLYFIN_GID:-1000}"
    network_mode: "host"
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL:-http://192.168.1.51:8096}
      - TZ=${TZ:-America/New_York}
    volumes:
      # Persistent configuration & metadata state
      - ${DATA_DIR:-./data}/config:/config
      # Transcoding and image cache directory
      - ${DATA_DIR:-./data}/cache:/cache
      # Read-only NAS media storage mount
      - ${MEDIA_DIR:-/mnt/nas/media}:/media:ro
    devices:
      # Intel QuickSync / VA-API hardware acceleration passthrough
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
